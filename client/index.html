<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F7F3" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="مصاريف: سجّل الإيداعات والمصروفات، تابع الضريبة، وصدّر سجلك بسهولة." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="مصاريف" />
    <title>مصاريف</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Apply the saved theme before the first paint to avoid a flash.
      try {
        var stored = localStorage.getItem("masarif.theme");
        var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
        var language = localStorage.getItem("masarif.language");
        if (language === "en") {
          document.documentElement.lang = "en";
          document.documentElement.dir = "ltr";
        }
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
