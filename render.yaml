# Render Blueprint: one free web service that serves the API and the built frontend.
# The database lives on Neon (free Postgres); paste its connection string into DATABASE_URL.
services:
  - type: web
    name: masarif
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
